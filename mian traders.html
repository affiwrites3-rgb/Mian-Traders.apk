<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mian Traders - Invoice Maker</title>

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1e3a8a" />

<style>
  :root{
    --blue-900:#1e3a8a; --blue-800:#1e40af; --blue-100:#dbeafe; --blue-50:#eff6ff;
    --red-600:#dc2626; --slate-800:#1e293b; --slate-500:#64748b; --slate-400:#94a3b8;
    --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--slate-100);font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--slate-800);}
  body{padding:20px 12px 40px;min-height:100vh;}
  .wrap{max-width:440px;margin:0 auto;}
  .app-title{text-align:center;margin-bottom:16px;}
  .app-title h1{font-size:20px;font-weight:800;color:var(--blue-900);margin:0;letter-spacing:-0.02em;}
  .app-title p{font-size:12px;color:var(--slate-500);margin:4px 0 0;}

  .progress-bar{height:6px;width:100%;background:var(--slate-200);border-radius:99px;overflow:hidden;margin-bottom:4px;}
  .progress-fill{height:100%;background:var(--blue-800);transition:width .3s ease;}
  .progress-label{font-size:11px;color:var(--slate-400);text-align:right;margin:0 0 16px;}

  .card{background:#fff;border:1px solid var(--slate-200);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);min-height:280px;display:flex;flex-direction:column;}

  .section-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
  .icon-badge{width:32px;height:32px;border-radius:10px;background:var(--blue-100);color:var(--blue-800);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
  .section-head h3{font-size:14px;font-weight:600;margin:0;color:var(--slate-800);}
  .section-head p{font-size:12px;color:var(--slate-400);margin:2px 0 0;}

  label.small{font-size:11px;color:var(--slate-500);display:block;margin:10px 0 4px;}
  input, select, textarea{
    width:100%;border:1px solid var(--slate-300);border-radius:12px;padding:11px 13px;font-size:14px;
    outline:none;transition:.15s;background:#fff;font-family:inherit;color:var(--slate-800);
  }
  input:focus, select:focus, textarea:focus{border-color:var(--blue-800);box-shadow:0 0 0 3px var(--blue-100);}
  textarea{resize:vertical;}

  .btn-row{display:flex;gap:8px;margin-top:auto;padding-top:20px;}
  .btn{border:none;border-radius:12px;font-size:14px;font-weight:600;padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;}
  .btn-primary{background:var(--blue-800);color:#fff;flex:1;}
  .btn-primary:active{background:var(--blue-900);}
  .btn-outline{background:#fff;color:var(--slate-500);border:1px solid var(--slate-300);}
  .btn:disabled{opacity:.6;}

  .item-card{border:1px solid var(--slate-200);border-radius:12px;padding:12px;background:var(--slate-100);margin-bottom:10px;}
  .item-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .item-card-head span{font-size:12px;font-weight:600;color:var(--blue-800);}
  .item-card-head button{background:none;border:none;color:#f87171;font-size:16px;cursor:pointer;padding:2px 6px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .item-amt{text-align:right;font-size:11px;color:var(--slate-500);margin-top:6px;}
  .items-scroll{max-height:340px;overflow-y:auto;padding-right:2px;}

  .add-item-btn{margin-top:10px;width:100%;border:1.5px dashed #93c5fd;background:none;color:var(--blue-800);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

  .subtotal-line{text-align:right;font-size:13px;font-weight:600;color:var(--slate-800);margin-top:12px;}

  .discount-box{margin-top:16px;background:var(--blue-50);border-radius:12px;padding:12px;font-size:13px;color:var(--blue-900);}
  .discount-box .row{display:flex;justify-content:space-between;padding:2px 0;}
  .discount-box .row.total{font-weight:800;border-top:1px solid #bfdbfe;margin-top:4px;padding-top:6px;}

  .invoice{background:#fff;border:2px solid var(--blue-900);border-radius:10px;overflow:hidden;}
  .invoice-inner{padding:20px 18px 12px;}
  .invoice-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .invoice-title{font-size:34px;font-weight:300;color:var(--blue-900);letter-spacing:1px;}
  .biz-name{font-size:19px;font-weight:800;color:var(--blue-900);text-align:right;line-height:1.1;}
  .biz-tag{font-size:13px;color:var(--blue-900);border-bottom:2px solid var(--red-600);display:inline-block;padding-bottom:2px;margin-top:2px;}
  .meta{margin-top:18px;font-size:13px;}
  .meta-row{display:flex;justify-content:space-between;border-bottom:1px dotted #93c5fd;padding:5px 0;color:var(--slate-500);}
  .meta-row b{color:var(--blue-900);}
  .meta-line{border-bottom:1px dotted #93c5fd;padding:5px 0;color:var(--slate-500);}
  .meta-line b{color:var(--blue-900);}

  table.items-table{width:100%;margin-top:14px;font-size:11px;border:1px solid var(--blue-100);border-collapse:collapse;border-radius:6px;overflow:hidden;}
  table.items-table th{background:var(--blue-50);color:var(--blue-900);font-weight:600;padding:7px 4px;border-bottom:1px solid var(--blue-100);}
  table.items-table td{text-align:center;padding:6px 4px;color:var(--blue-900);border-bottom:1px solid #eff6ff;}
  table.items-table td.desc{text-align:left;padding-left:6px;}

  .totals-area{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:14px;}
  .words{font-size:11px;color:var(--slate-500);flex:1;line-height:1.4;}
  .words b{color:var(--blue-900);}
  .totals-right{text-align:right;flex-shrink:0;}
  .totals-right .row{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--slate-500);}
  .grand-total{margin-top:5px;border:1px solid var(--blue-900);border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .grand-total span:first-child{font-size:11px;font-weight:600;color:var(--blue-900);}
  .grand-total span:last-child{font-size:18px;font-weight:800;color:var(--blue-900);}

  .invoice-footer{background:var(--blue-900);color:#fff;text-align:center;font-size:11px;padding:10px 12px;}

  .action-row{display:flex;gap:8px;margin-top:16px;}
  .reset-btn{width:100%;background:none;border:none;color:var(--slate-400);font-size:12px;padding:10px;margin-top:6px;cursor:pointer;font-family:inherit;}

  .note-box{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:11px;border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-title">
    <h1>Mian Traders</h1>
    <p>Invoice Maker</p>
  </div>

  <div id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p class="progress-label" id="progressLabel">1 / 6</p>
  </div>

  <div id="stepContainer"></div>
</div>

<script>
/* ---------------- PACKAGE RATE LIST ----------------
   ⚠️ Placeholder values below — the uploaded rate-list image
   couldn't be read (it came through corrupted/truncated twice).
   Update this list with your real package names, quantities and
   prices, exactly in this format, and everything downstream
   (dropdown, price auto-fill, calculations) updates automatically.
------------------------------------------------------ */
const PACKAGES = [
  { name: "Package 3MB",  price: 1800 },
  { name: "Package 4MB",  price: 2100 },
  { name: "Package 6MB",  price: 2600 },
  { name: "Package 8MB",  price: 3100 },
  { name: "Package 10MB", price: 3600 },
  { name: "Package 15MB", price: 4800 },
];

const CATEGORIES = ["Device", "Installation", "Wire / Cable", "Package", "Service", "Other"];
const STEPS = ["customer","cnic","phone","address","items","discount","preview"];
const BUSINESS_NAME = "Mian Traders";
const BUSINESS_TAG = "Traders";
const OFFICE_ADDRESS = "Office #264 Misri Town (II) Chak No. 73/3R Haroonabad";
const OFFICE_CELL = "+92 321 7336815";

function newItem(){
  return { id: Math.random().toString(36).slice(2,9), category: "Device", description:"", package: PACKAGES[0].name, qty:"1", price:"" };
}

const state = {
  step: 0,
  billNo: String(Math.floor(Math.random()*900)+100),
  date: (()=>{const d=new Date();return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2);})(),
  customerName: "",
  cnic: "",
  phone: "",
  address: "",
  items: [newItem()],
  discountType: "Rs",
  discountValue: "0",
};

/* ---------------- number to words ---------------- */
const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function threeDigits(n){let s="";if(n>=100){s+=ones[Math.floor(n/100)]+" Hundred ";n%=100;}if(n>=20){s+=tens[Math.floor(n/10)]+" ";n%=10;}if(n>0){s+=ones[n]+" ";}return s.trim();}
function numberToWords(num){
  num=Math.round(num);
  if(num===0) return "Zero";
  let word="";
  const crore=Math.floor(num/10000000); num%=10000000;
  const lakh=Math.floor(num/100000); num%=100000;
  const thousand=Math.floor(num/1000); num%=1000;
  const rest=num;
  if(crore) word+=threeDigits(crore)+" Crore ";
  if(lakh) word+=threeDigits(lakh)+" Lakh ";
  if(thousand) word+=threeDigits(thousand)+" Thousand ";
  if(rest) word+=(word?"and ":"")+threeDigits(rest);
  return word.trim();
}

/* ---------------- calculations ---------------- */
function getSubtotal(){
  return state.items.reduce((sum,it)=>sum+((parseFloat(it.qty)||0)*(parseFloat(it.price)||0)),0);
}
function getDiscountAmt(subtotal){
  return state.discountType==="%" ? subtotal*((parseFloat(state.discountValue)||0)/100) : (parseFloat(state.discountValue)||0);
}

/* ---------------- render ---------------- */
const container = document.getElementById("stepContainer");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const progressWrap = document.getElementById("progressWrap");

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(){
  const step = STEPS[state.step];
  progressWrap.style.display = step === "preview" ? "none" : "block";
  progressFill.style.width = ((state.step+1)/STEPS.length*100)+"%";
  progressLabel.textContent = (state.step+1)+" / "+STEPS.length;

  if(step === "preview"){ renderPreview(); return; }

  let inner = "";
  if(step==="customer"){
    inner = fieldCard("👤","Customer ka naam","Sabse pehle customer ka naam pucho", `
      <input id="f_custname" placeholder="Customer name" value="${esc(state.customerName)}" />
    `);
  } else if(step==="cnic"){
    inner = fieldCard("🪪","CNIC number","Ab customer ka CNIC number", `
      <input id="f_cnic" placeholder="XXXXX-XXXXXXX-X" value="${esc(state.cnic)}" />
    `);
  } else if(step==="phone"){
    inner = fieldCard("📞","Phone number","Customer ka contact number", `
      <input id="f_phone" placeholder="03XX-XXXXXXX" value="${esc(state.phone)}" />
    `);
  } else if(step==="address"){
    inner = fieldCard("📍","Address","Customer ka address", `
      <textarea id="f_address" rows="3" placeholder="Full address">${esc(state.address)}</textarea>
    `);
  } else if(step==="items"){
    inner = `
      <div class="section-head"><div class="icon-badge">📦</div><div><h3>Items</h3><p>Category chunein — Package select karne par rate khud aa jayega</p></div></div>
      <div class="items-scroll" id="itemsScroll">
        ${state.items.map((it,idx)=>itemCardHtml(it,idx)).join("")}
      </div>
      <button class="add-item-btn" id="addItemBtn">+ Aur item add karein</button>
      <div class="subtotal-line">Subtotal: Rs ${getSubtotal().toLocaleString()}</div>
    `;
  } else if(step==="discount"){
    const subtotal = getSubtotal();
    const discountAmt = getDiscountAmt(subtotal);
    const total = Math.max(0, subtotal-discountAmt);
    inner = `
      <div class="section-head"><div class="icon-badge">%</div><div><h3>Discount</h3><p>Koi discount dena hai to yahan batayein</p></div></div>
      <div style="display:flex;gap:8px;">
        <select id="f_disctype" style="width:96px;flex-shrink:0;">
          <option value="Rs" ${state.discountType==="Rs"?"selected":""}>Rs</option>
          <option value="%" ${state.discountType==="%"?"selected":""}>%</option>
        </select>
        <input id="f_discval" type="number" placeholder="0" value="${esc(state.discountValue)}" />
      </div>
      <div class="discount-box">
        <div class="row"><span>Subtotal</span><span>Rs ${subtotal.toLocaleString()}</span></div>
        <div class="row"><span>Discount</span><span>- Rs ${discountAmt.toLocaleString()}</span></div>
        <div class="row total"><span>Total</span><span>Rs ${total.toLocaleString()}</span></div>
      </div>
    `;
  }

  const isLast = state.step === STEPS.length-2;
  container.innerHTML = `
    <div class="card">
      ${inner}
      <div class="btn-row">
        ${state.step>0 ? `<button class="btn btn-outline" id="backBtn">‹ Back</button>` : ""}
        <button class="btn btn-primary" id="nextBtn">${isLast?"Invoice Banayein":"Next"} ›</button>
      </div>
    </div>
  `;

  attachStepEvents(step);
}

function fieldCard(icon,title,sub,body){
  return `<div class="section-head"><div class="icon-badge">${icon}</div><div><h3>${title}</h3><p>${sub}</p></div></div><div>${body}</div>`;
}

function itemCardHtml(it, idx){
  const amt = ((parseFloat(it.qty)||0)*(parseFloat(it.price)||0)).toLocaleString();
  const isPackage = it.category === "Package";
  return `
    <div class="item-card" data-id="${it.id}">
      <div class="item-card-head">
        <span>Item ${idx+1}</span>
        ${state.items.length>1 ? `<button class="removeItemBtn" data-id="${it.id}">✕</button>` : ""}
      </div>
      <select class="it-cat" data-id="${it.id}">
        ${CATEGORIES.map(c=>`<option value="${esc(c)}" ${it.category===c?"selected":""}>${esc(c)}</option>`).join("")}
      </select>
      ${isPackage ? `
        <select class="it-pkg" data-id="${it.id}" style="margin-top:8px;">
          ${PACKAGES.map(p=>`<option value="${esc(p.name)}" data-price="${p.price}" ${it.package===p.name?"selected":""}>${esc(p.name)} — Rs ${p.price.toLocaleString()}</option>`).join("")}
        </select>
      ` : `
        <input class="it-desc" data-id="${it.id}" placeholder="Description" value="${esc(it.description)}" style="margin-top:8px;" />
      `}
      <div class="grid-2">
        <div><label class="small" style="margin:8px 0 2px;">Quantity</label><input class="it-qty" data-id="${it.id}" type="number" min="1" value="${esc(it.qty)}" /></div>
        <div><label class="small" style="margin:8px 0 2px;">Unit Price (Rs)</label><input class="it-price" data-id="${it.id}" type="number" placeholder="Price" value="${esc(it.price)}" ${isPackage?"readonly":""} /></div>
      </div>
      <div class="item-amt">Amount: Rs ${amt}</div>
    </div>
  `;
}

function attachStepEvents(step){
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.onclick = ()=>{ state.step=Math.max(0,state.step-1); render(); };
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.onclick = ()=>{ saveStepValues(step); state.step=Math.min(STEPS.length-1,state.step+1); render(); };

  if(step==="items"){
    document.getElementById("addItemBtn").onclick = ()=>{ state.items.push(newItem()); render(); };
    document.querySelectorAll(".removeItemBtn").forEach(b=>{
      b.onclick=()=>{ const id=b.dataset.id; if(state.items.length>1){ state.items=state.items.filter(it=>it.id!==id); render(); } };
    });
    document.querySelectorAll(".it-cat").forEach(el=>el.onchange=()=>{
      const it = state.items.find(i=>i.id===el.dataset.id);
      it.category = el.value;
      if(it.category === "Package"){
        it.package = it.package || PACKAGES[0].name;
        const pkg = PACKAGES.find(p=>p.name===it.package) || PACKAGES[0];
        it.package = pkg.name;
        it.price = String(pkg.price);
      } else {
        it.price = "";
      }
      render();
    });
    document.querySelectorAll(".it-pkg").forEach(el=>el.onchange=()=>{
      const it = state.items.find(i=>i.id===el.dataset.id);
      const opt = el.options[el.selectedIndex];
      it.package = el.value;
      it.price = opt.dataset.price;
      render();
    });
    document.querySelectorAll(".it-desc").forEach(el=>el.oninput=()=>updateItem(el.dataset.id,"description",el.value));
    document.querySelectorAll(".it-qty").forEach(el=>el.oninput=()=>{updateItem(el.dataset.id,"qty",el.value); refreshItemAmounts();});
    document.querySelectorAll(".it-price").forEach(el=>el.oninput=()=>{updateItem(el.dataset.id,"price",el.value); refreshItemAmounts();});
  }
}

function updateItem(id, field, value){
  const it = state.items.find(i=>i.id===id);
  if(it) it[field]=value;
}

function refreshItemAmounts(){
  document.querySelectorAll(".item-card").forEach(card=>{
    const id = card.dataset.id;
    const it = state.items.find(i=>i.id===id);
    const amt = ((parseFloat(it.qty)||0)*(parseFloat(it.price)||0)).toLocaleString();
    card.querySelector(".item-amt").textContent = "Amount: Rs "+amt;
  });
  const subtotalEl = document.querySelector(".subtotal-line");
  if(subtotalEl) subtotalEl.textContent = "Subtotal: Rs "+getSubtotal().toLocaleString();
}

function saveStepValues(step){
  if(step==="customer"){ state.customerName=val("f_custname"); }
  else if(step==="cnic"){ state.cnic=val("f_cnic"); }
  else if(step==="phone"){ state.phone=val("f_phone"); }
  else if(step==="address"){ state.address=val("f_address"); }
  else if(step==="discount"){ state.discountType=val("f_disctype"); state.discountValue=val("f_discval"); }
}
function val(id){ const el=document.getElementById(id); return el?el.value:""; }

/* ---------------- preview ---------------- */
function renderPreview(){
  const subtotal = getSubtotal();
  const discountAmt = getDiscountAmt(subtotal);
  const total = Math.max(0, subtotal-discountAmt);

  const rows = state.items.map((it,i)=>{
    const desc = it.category === "Package" ? it.package : (it.description || "-");
    return `
    <tr>
      <td>${i+1}</td>
      <td class="desc">${esc(desc)}</td>
      <td style="font-size:9px;">${esc(it.category)}</td>
      <td>${it.qty||0}</td>
      <td>${it.price||0}</td>
      <td style="font-weight:600;">${((parseFloat(it.qty)||0)*(parseFloat(it.price)||0)).toLocaleString()}</td>
    </tr>
  `;}).join("");

  container.innerHTML = `
    <div class="invoice" id="invoiceNode">
      <div class="invoice-inner">
        <div class="invoice-top">
          <div class="invoice-title">Invoice</div>
          <div>
            <div class="biz-name">${esc(BUSINESS_NAME)}</div>
            <div class="biz-tag">${esc(BUSINESS_TAG)}</div>
          </div>
        </div>
        <div class="meta">
          <div class="meta-row"><span>Date: <b>${esc(state.date)}</b></span><span>Bill No. <b style="color:#dc2626;">${esc(state.billNo)}</b></span></div>
          <div class="meta-line">Customer Name: <b>${esc(state.customerName)||"-"}</b></div>
          <div class="meta-line">CNIC: <b>${esc(state.cnic)||"-"}</b></div>
          <div class="meta-line">Address / Cell: <b>${esc([state.address,state.phone].filter(Boolean).join(" / "))||"-"}</b></div>
        </div>
        <table class="items-table">
          <thead><tr><th style="width:20px;">Sr.</th><th style="text-align:left;">Description</th><th>Cat.</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="totals-area">
          <div class="words">Rupees <b>${numberToWords(total)} Only</b></div>
          <div class="totals-right">
            <div class="row"><span>Subtotal</span><span>${subtotal.toLocaleString()}</span></div>
            <div class="row"><span>Discount</span><span>-${discountAmt.toLocaleString()}</span></div>
            <div class="grand-total"><span>Total Rs.</span><span>${total.toLocaleString()}</span></div>
          </div>
        </div>
      </div>
      <div class="invoice-footer">${esc(OFFICE_ADDRESS)} | CELL: ${esc(OFFICE_CELL)}</div>
    </div>
    <div class="action-row">
      <button class="btn btn-outline" id="editBtn">‹ Edit</button>
      <button class="btn btn-primary" id="exportBtn">⬇ Image Export</button>
      <button class="btn btn-outline" id="printBtn" style="flex:0 0 46px;">🖨</button>
    </div>
    <button class="reset-btn" id="resetBtn">↺ Naya invoice shuru karein</button>
  `;
  progressWrap.style.display = "none";

  document.getElementById("editBtn").onclick = ()=>{ state.step=5; render(); };
  document.getElementById("printBtn").onclick = ()=>window.print();
  document.getElementById("resetBtn").onclick = resetAll;
  document.getElementById("exportBtn").onclick = exportImage;
}

function resetAll(){
  state.step=0;
  state.billNo=String(Math.floor(Math.random()*900)+100);
  state.customerName=""; state.cnic=""; state.phone=""; state.address="";
  state.items=[newItem()]; state.discountType="Rs"; state.discountValue="0";
  render();
}
/* items list default already resets to category "Device" with blank description via newItem() */

/* ---------------- image export: drawn directly on canvas, no SVG/foreignObject ----------------
   This avoids the "stuck on Exporting..." bug some Android browsers have with the
   SVG+foreignObject-to-canvas technique (the canvas can silently get security-blocked
   there). Drawing text/shapes straight onto canvas has no such risk. */
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(" ");
  let line = "";
  let lines = 0;
  for (let i=0;i<words.length;i++){
    const test = line + words[i] + " ";
    if (ctx.measureText(test).width > maxWidth && line !== ""){
      ctx.fillText(line.trim(), x, y + lines*lineHeight);
      line = words[i] + " ";
      lines++;
    } else {
      line = test;
    }
  }
  ctx.fillText(line.trim(), x, y + lines*lineHeight);
  return lines + 1;
}

function drawInvoiceCanvas(){
  const subtotal = getSubtotal();
  const discountAmt = getDiscountAmt(subtotal);
  const total = Math.max(0, subtotal - discountAmt);

  const W = 720;
  const PAD = 30;
  const rowH = 30;
  const tableTop0 = 300; // provisional, recalculated below once we know header height
  const headerRows = 1;
  const itemRows = state.items.length;
  const tableH = (headerRows + itemRows) * rowH;
  const wordsLines = Math.max(1, Math.ceil((numberToWords(total).length + 14) / 46));
  const H = 300 + tableH + 40 + (wordsLines*18) + 90 + 60; // header+meta + table + totals + footer + padding

  const canvas = document.createElement("canvas");
  const scale = 2.5;
  canvas.width = W*scale; canvas.height = H*scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  const blue900 = "#1e3a8a", blue800="#1e40af", blue100="#dbeafe", blue50="#eff6ff",
        red600="#dc2626", slate500="#64748b", slate800="#1e293b";

  // background + border
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = blue900; ctx.lineWidth = 3;
  ctx.strokeRect(3,3,W-6,H-6);

  // header
  ctx.fillStyle = blue900;
  ctx.font = "300 42px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Invoice", PAD, 75);

  ctx.font = "800 22px Arial";
  ctx.textAlign = "right";
  ctx.fillText(BUSINESS_NAME, W-PAD, 60);
  ctx.font = "600 14px Arial";
  ctx.fillText(BUSINESS_TAG, W-PAD, 82);
  const tagW = ctx.measureText(BUSINESS_TAG).width;
  ctx.strokeStyle = red600; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W-PAD-tagW, 87); ctx.lineTo(W-PAD, 87); ctx.stroke();

  // meta rows
  let y = 120;
  ctx.textAlign = "left";
  ctx.font = "13px Arial";
  function dottedLine(yy){
    ctx.strokeStyle = "#93c5fd"; ctx.lineWidth = 1;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(PAD, yy); ctx.lineTo(W-PAD, yy); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle = slate500;
  ctx.fillText("Date: ", PAD, y);
  ctx.fillStyle = blue900; ctx.font="700 13px Arial";
  ctx.fillText(state.date, PAD+35, y);
  ctx.fillStyle = slate500; ctx.font="13px Arial";
  ctx.textAlign="right";
  ctx.fillText("Bill No. ", W-PAD-40, y);
  ctx.fillStyle = red600; ctx.font="700 13px Arial";
  ctx.fillText(state.billNo, W-PAD, y);
  ctx.textAlign="left";
  dottedLine(y+8); y+=34;

  function metaLine(label, value){
    ctx.fillStyle = slate500; ctx.font="13px Arial";
    ctx.fillText(label, PAD, y);
    const labelW = ctx.measureText(label).width;
    ctx.fillStyle = blue900; ctx.font="700 13px Arial";
    ctx.fillText(value || "-", PAD+labelW, y);
    dottedLine(y+8); y+=34;
  }
  metaLine("Customer Name: ", state.customerName);
  metaLine("CNIC: ", state.cnic);
  metaLine("Address / Cell: ", [state.address, state.phone].filter(Boolean).join(" / "));

  // table
  y += 10;
  const tableTop = y;
  const cols = [ {label:"Sr.", w:35}, {label:"Description", w:230}, {label:"Cat.", w:90}, {label:"Qty", w:65}, {label:"Price", w:100}, {label:"Amount", w:W-2*PAD-35-230-90-65-100} ];
  let cx = PAD;
  ctx.fillStyle = blue50;
  ctx.fillRect(PAD, tableTop, W-2*PAD, rowH);
  ctx.strokeStyle = blue100; ctx.lineWidth=1;
  ctx.strokeRect(PAD, tableTop, W-2*PAD, rowH);
  ctx.fillStyle = blue900; ctx.font = "700 12px Arial"; ctx.textAlign="center";
  cols.forEach(c=>{ ctx.fillText(c.label, cx+c.w/2, tableTop+19); cx+=c.w; });

  let ry = tableTop + rowH;
  ctx.font = "12px Arial";
  state.items.forEach((it,i)=>{
    const desc = it.category === "Package" ? it.package : (it.description || "-");
    const amt = ((parseFloat(it.qty)||0) * (parseFloat(it.price)||0));
    ctx.strokeStyle = "#eff6ff";
    ctx.strokeRect(PAD, ry, W-2*PAD, rowH);
    let cxx = PAD;
    ctx.fillStyle = blue900;
    ctx.textAlign="center";
    ctx.fillText(String(i+1), cxx+cols[0].w/2, ry+19); cxx+=cols[0].w;
    ctx.textAlign="left";
    const truncDesc = desc.length>26 ? desc.slice(0,24)+"…" : desc;
    ctx.fillText(truncDesc, cxx+6, ry+19); cxx+=cols[1].w;
    ctx.textAlign="center";
    ctx.font="10px Arial";
    ctx.fillText(it.category, cxx+cols[2].w/2, ry+19); cxx+=cols[2].w;
    ctx.font="12px Arial";
    ctx.fillText(String(it.qty||0), cxx+cols[3].w/2, ry+19); cxx+=cols[3].w;
    ctx.fillText(String(it.price||0), cxx+cols[4].w/2, ry+19); cxx+=cols[4].w;
    ctx.font="700 12px Arial";
    ctx.fillText(amt.toLocaleString(), cxx+cols[5].w/2, ry+19);
    ctx.font="12px Arial";
    ry += rowH;
  });

  // totals
  y = ry + 22;
  ctx.textAlign="left";
  ctx.fillStyle = slate500; ctx.font="11px Arial";
  const wordsFull = "Rupees " + numberToWords(total) + " Only";
  const linesDrawn = wrapText(ctx, wordsFull, PAD, y, 330, 16);
  ctx.font="700 11px Arial";

  const totalsRightX = W-PAD;
  let ty = y - 4;
  ctx.textAlign="right";
  ctx.fillStyle = slate500; ctx.font="11px Arial";
  ctx.fillText("Subtotal   " + subtotal.toLocaleString(), totalsRightX, ty); ty+=16;
  ctx.fillText("Discount   -" + discountAmt.toLocaleString(), totalsRightX, ty); ty+=14;

  const boxW = 190, boxH = 34, boxX = W-PAD-boxW, boxY = ty;
  ctx.strokeStyle = blue900; ctx.lineWidth=1.5;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = blue900; ctx.font="700 12px Arial"; ctx.textAlign="left";
  ctx.fillText("Total Rs.", boxX+10, boxY+22);
  ctx.font="800 20px Arial"; ctx.textAlign="right";
  ctx.fillText(total.toLocaleString(), boxX+boxW-10, boxY+24);

  // footer bar
  const footerY = Math.max(y + linesDrawn*16 + 20, boxY + boxH + 20);
  ctx.fillStyle = blue900;
  ctx.fillRect(0, footerY, W, H-footerY);
  ctx.fillStyle = "#ffffff"; ctx.font="700 12px Arial"; ctx.textAlign="center";
  const footerText = OFFICE_ADDRESS + "  |  CELL: " + OFFICE_CELL;
  ctx.fillText(footerText, W/2, footerY + (H-footerY)/2 + 4);

  return canvas;
}

function exportImage(){
  const exportBtn = document.getElementById("exportBtn");
  exportBtn.disabled = true;
  exportBtn.textContent = "Exporting...";

  function resetBtn(){ exportBtn.disabled=false; exportBtn.textContent="⬇ Image Export"; }

  async function saveBlob(blob){
    const fileName = "invoice-"+state.billNo+".png";
    try {
      const file = new File([blob], fileName, {type:"image/png"});
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: fileName });
          resetBtn();
          return;
        } catch(e){ /* user cancelled or share failed, fall through to download */ }
      }
    } catch(e){ /* File/share not supported, fall through */ }

    try {
      const a = document.createElement("a");
      a.download = fileName;
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch(e){ /* ignore, we still show fallback below if needed */ }
    resetBtn();
  }

  try {
    const canvas = drawInvoiceCanvas();
    canvas.toBlob((blob)=>{
      if(!blob){
        resetBtn();
        alert("Image ban nahi saki. Print button try karein.");
        return;
      }
      saveBlob(blob);
    }, "image/png");
  } catch(e){
    resetBtn();
    alert("Export mein masla aaya: " + (e && e.message ? e.message : "unknown") + "\\nPrint button try karein.");
  }
}

render();
</script>
